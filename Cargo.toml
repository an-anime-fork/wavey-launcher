[package]
name = "pretty-waves"
version = "1.0.1"
description = "Wavey Launcher"
authors = ["Nikita Podvirnyi <krypt0nn@vk.com>"]
homepage = "https://github.com/an-anime-fork/wavey-launcher"
repository = "https://github.com/an-anime-fork/wavey-launcher"
license = "GPL-3.0"
edition = "2021"
build = "build.rs"

[profile.release]
strip = true
lto = true
opt-level = "s"

[build-dependencies]
glib-build-tools = "0.21"

[dependencies.anime-launcher-sdk]
git = "https://github.com/an-anime-fork/anime-launcher-sdk"
tag = "feat/wuwa/steamified/latest"
workspace = true
features = [ "all", "steam", "piston" ] #, "wuwa-steam" ] # get a feature shield for wuwa-specific?
# path = "../anime-launcher-sdk" # ! for dev purposes only

[dependencies]
relm4 = { version = "0.9", features = ["macros", "libadwaita"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_7"] }

rfd = { version = "0.15.4", features = ["xdg-portal", "tokio"], default-features = false }
open = "5.3.3"
whatadistro = "0.1.0"

serde_json = "1.0"
anyhow = "1.0"
lazy_static = "1.5.0"
cached = { version = "0.55", features = ["proc_macro"] }
md-5 = { version = "0.10", features = ["asm"] }
enum-ordinalize = "4.3"

tracing = "0.1"
tracing-subscriber = "0.3"

fluent-templates = "0.13"
unic-langid = "0.9"

human-panic = "2.0.3"
microxdg = "0.2"

ksni = { version = "0.3.1", features = ["blocking"] }
image = "0.25"
notify = "8"
glob = "0.3"

# full screen experience
gilrs = "0.11"
